    <meta name="description" content="Track your favorite TV shows and movies with Flicklet. Discover new content, manage your watchlist, and never miss an episode." />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="color-scheme" content="light dark" />

    <title>Flicklet V2</title>

    <!-- Match --bg dark token so native cold start is not a white flash -->
    <style>
      html, body {
        background-color: #0f1115;
        color: #e6eaf0;
        margin: 0;
      }
    </style>

    <!-- First-Paint Gate CSS: kills transitions while gated (web first visit only) -->
    <style id="fp-gate-css">
      html.fp-gate * { transition: none !important; animation: none !important; }
      html.fp-gate body { visibility: hidden; }
      html.fp-gate .app-splash { visibility: visible; }
    </style>

    <!-- Native/Capacitor: skip fp-gate, show themed splash immediately while JS loads -->
    <script>
      (function () {
        try {
          var primed = localStorage.getItem('app:primed') === '1';
          var isCapacitorWebView =
            location.hostname === 'localhost' &&
            (location.protocol === 'https:' ||
              location.protocol === 'http:' ||
              location.protocol === 'capacitor:');
          var skipGate = primed || isCapacitorWebView;
          if (!skipGate) {
            document.documentElement.classList.add('fp-gate');
          } else {
            var splash = document.querySelector('.app-splash');
            if (splash) splash.style.visibility = 'visible';
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-f09c8c64.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/firebase-auth-127d4d11.js">
    <link rel="modulepreload" crossorigin href="./assets/firebase-firestore-1c18a094.js">
    <link rel="modulepreload" crossorigin href="./assets/react-vendor-55abab24.js">
    <link rel="modulepreload" crossorigin href="./assets/firebase-app-eea1fbb7.js">
    <link rel="modulepreload" crossorigin href="./assets/games-db865b1c.js">
  </head>
  <body>
    <div
      class="app-splash"
      style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#a9b3c1;visibility:hidden;z-index:99990;"
    >
      <div style="font:600 14px/1.2 system-ui,sans-serif;opacity:.85;">Loading…</div>
    </div>
    <div id="root"></div>
    
    <!-- Hidden form for Netlify Forms detection -->
    <form name="feedback" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="message" />
      <input type="text" name="theme" />
      <input type="text" name="timestamp" />
    </form>
    
    
  </body>
</html>
