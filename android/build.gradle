// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor 7 Android library targets Java 21; use toolchain so compile works when Gradle runs on JDK 17.
subprojects { subproject ->
    subproject.tasks.withType(JavaCompile).configureEach {
        javaCompiler = subproject.javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
